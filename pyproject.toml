[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fintrace"
version = "0.1.0"
description = "Evidence-first RAG system for financial filings."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "uvicorn[standard]",
    "httpx",
    "beautifulsoup4>=4.15.0",
    "pypdf>=6.19.0",
    "qdrant-client>=1.19.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pytest-asyncio>=1.4.0",
    "reportlab>=5.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fintrace"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
